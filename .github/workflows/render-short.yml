name: Render OffTheRecord Short
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Public HTTPS video link (YouTube or direct MP4/WebM)'
        required: true
        type: string
      artist:
        description: 'Performer'
        required: true
        type: string
      title:
        description: 'Song or performance title'
        required: true
        type: string
      duration:
        description: 'Seconds (maximum 60)'
        required: true
        default: '42'
        type: string
      rights_confirmed:
        description: 'I have rights to reuse both video and audio on intended platforms'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  render:
    if: ${{ inputs.rights_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Download compatible source to MP4
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: python download_source.py --url "$SOURCE_URL" --output source-video.mp4
      - name: Render and verify
        env:
          ARTIST: ${{ inputs.artist }}
          TITLE: ${{ inputs.title }}
          DURATION: ${{ inputs.duration }}
        run: python render.py --source source-video.mp4 --artist "$ARTIST" --title "$TITLE" --duration "$DURATION"
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: offtherecord-short
          path: output/offtherecord-short.mp4
          retention-days: 7
