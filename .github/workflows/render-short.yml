name: Render OffTheRecord Short
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Direct HTTPS MP4 or WebM URL, licensed video AND audio'
        required: true
        type: string
      artist:
        description: 'Performer'
        required: true
        type: string
      title:
        description: 'Song or performance title'
        required: true
        type: string
      duration:
        description: 'Seconds (maximum 60)'
        required: true
        default: '42'
        type: string
      rights_confirmed:
        description: 'I verified reuse permission for both footage and audio'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  render:
    if: ${{ inputs.rights_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Download source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import os,urllib.parse,urllib.request
          u=os.environ["SOURCE_URL"]
          p=urllib.parse.urlsplit(u)
          if p.scheme!="https" or not p.hostname:raise SystemExit("Direct HTTPS URL required")
          with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=90) as r,open("source-video","wb") as f:
            n=0
            while True:
              b=r.read(1024*1024)
              if not b:break
              n+=len(b)
              if n>300*1024*1024:raise SystemExit("Source exceeds 300 MB")
              f.write(b)
          PY
      - name: Render and verify
        env:
          ARTIST: ${{ inputs.artist }}
          TITLE: ${{ inputs.title }}
          DURATION: ${{ inputs.duration }}
        run: python render.py --source source-video --artist "$ARTIST" --title "$TITLE" --duration "$DURATION"
      - uses: actions/upload-artifact@v4
        with:
          name: offtherecord-short
          path: output/offtherecord-short.mp4
          retention-days: 7
