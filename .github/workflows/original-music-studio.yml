name: Original Music Video Studio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project readiness
        run: |
          python3 - <<'PY'
          import json,sys
          p=json.load(open("studio/project.json"))
          problems=[]
          if p.get("rights_confirmed") is not True: problems.append("rights_confirmed must be true only after verifying rights to all media")
          if not p.get("song_url"): problems.append("song_url is missing")
          if not p.get("scenes") or any(not s.get("video_url") for s in p.get("scenes",[])): problems.append("one or more scene video_url fields are missing")
          if problems:
              print("::notice title=Studio waiting for media::This is a project template, not a ready-to-render music video.")
              for issue in problems: print("::notice::"+issue)
              print("Edit studio/project.json with licensed media before running the production workflow.")
              sys.exit(0)
          print("Project inputs are present; production rendering can proceed.")
          PY
  render:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ false }}
    steps:
      - run: echo "Use the ready-to-render workflow once project media has been supplied."
