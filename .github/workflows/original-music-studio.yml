name: Original Music Video Studio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate original instrumental and lyric animation
        run: python3 studio/generate_original.py --out offtherecord-original-59s.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: offtherecord-original-music-video
          path: offtherecord-original-59s.mp4
          retention-days: 7
