name: Free Manual Repository Checks

# Manual-only: no paid AI, external APIs, scheduled runs, or automatic triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository files without installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD~1 HEAD 2>/dev/null || git diff --check
          python3 - <<'PY'
          import ast
          from pathlib import Path
          count = 0
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git', '.venv', 'venv', 'node_modules'} for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
              count += 1
          print(f'Python syntax checks passed: {count} files')
          PY
          echo "Free manual checks complete. No AI API called."
