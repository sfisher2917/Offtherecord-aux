name: Cloud Vocal Song (Hugging Face)
on:
  workflow_dispatch:
    inputs:
      inspect_api_only:
        description: "Inspect the Space API without generating audio"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cloud-song:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_MUSIC_SPACE: ${{ secrets.HF_MUSIC_SPACE }}
      HF_MUSIC_ENDPOINT: ${{ secrets.HF_MUSIC_ENDPOINT }}
      HF_MUSIC_INPUTS_JSON: ${{ secrets.HF_MUSIC_INPUTS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INSPECT_API: ${{ inputs.inspect_api_only && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install client and FFmpeg
        run: |
          python3 -m pip install --user 'gradio_client>=1.0,<3'
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate via free-quota cloud Space
        run: python3 studio/generate_hf_song.py --song studio/song.json --out offtherecord-original-vocals-59s.mp3
      - name: Upload audio
        if: ${{ !inputs.inspect_api_only }}
        uses: actions/upload-artifact@v4
        with:
          name: offtherecord-cloud-vocals-59s
          path: offtherecord-original-vocals-59s.mp3
          retention-days: 7
