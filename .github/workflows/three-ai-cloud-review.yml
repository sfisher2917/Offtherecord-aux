name: Two AI Cloud Review (manual, zero-cost gate)
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Non-sensitive prompt (sent to two external AI providers)'
        required: true
        type: string
      approve_external_transfer:
        description: 'I approve sending this prompt to both providers'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: two-ai-cloud-review
  cancel-in-progress: false
jobs:
  review:
    if: ${{ inputs.approve_external_transfer == true && vars.AI_PROVIDER_FREE_TIERS_VERIFIED == 'true' && vars.ACTIONS_ZERO_COST_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test gateway offline
        run: node --test ai-gateway/self-hosted/server.test.js
      - name: Review with two models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GATEWAY_TOKEN: ephemeral-internal-runner
          ENABLED: 'true'
          ZERO_COST_VERIFIED: 'true'
          MAX_REQUESTS_PER_PROCESS: '1'
          REVIEW_PROMPT: ${{ inputs.prompt }}
        run: |
          node --input-type=module <<'NODE'
          import {createHandler} from './ai-gateway/self-hosted/server.js';
          import {Readable} from 'node:stream';
          if (!process.env.GROQ_API_KEY || !process.env.OPENROUTER_API_KEY) {
            throw Error('Both provider secrets must be configured');
          }
          const req=Readable.from([JSON.stringify({prompt:process.env.REVIEW_PROMPT})]);
          req.url='/review';req.method='POST';
          req.headers={authorization:'Bearer '+process.env.GATEWAY_TOKEN,'content-type':'application/json'};
          const res={writeHead(status){this.status=status;},end(body){this.body=body;}};
          await createHandler()(req,res);
          if(res.status!==200)throw Error('Gateway returned '+res.status);
          const data=JSON.parse(res.body);
          const summary=['# Two-provider review',...data.results.map(x=>'## '+x.provider+' ('+x.status+')\n\n'+(x.answer||'No answer returned'))].join('\n\n');
          await import('node:fs/promises').then(fs=>fs.appendFile(process.env.GITHUB_STEP_SUMMARY,summary));
          if(data.results.some(x=>x.status!=='ok'))process.exitCode=1;
          NODE
