name: VICEWIRE review-only render
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render only if authorized footage is present
        run: python3 vicewire/agent_editor.py --manifest vicewire/example_manifest.json
      - name: Upload review file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vicewire-review-only
          path: vicewire/output/review.mp4
